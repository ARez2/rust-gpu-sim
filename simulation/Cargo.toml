[package]
name = "simulation"
version = "0.0.0"
publish = false
edition = "2024"
default-run = "simulation"

[lints]
workspace = true


[dependencies]
cfg-if = "1.0.0"
shared = { path = "../shaders/shared" }
futures = { version = "0.3", default-features = false, features = [
    "std",
    "executor",
] }
# Vulkan SDK or MoltenVK needs to be installed for `vulkan-portability` to work on macOS
wgpu = { version = "26.0.1", features = ["spirv", "vulkan-portability"] }
winit = { version = "0.30.0", features = ["rwh_05"] }
clap = { version = "4", features = ["derive"] }
strum = { version = "0.27.2", default-features = false, features = [
    "std",
    "derive",
] }
bytemuck = "1.6.3"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cargo-gpu = { git = "https://github.com/rust-gpu/cargo-gpu" }
env_logger = "0.11.0"
# spirv-builder = { workspace = true, features = ["watch"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.78", features = ["Performance"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen-futures = "0.4.51"


[build-dependencies]
cargo-gpu = { git = "https://github.com/rust-gpu/cargo-gpu" }
